name: Nuclei Vulnerability Scan Called Workflow

on:
  workflow_call:
    inputs:
      urls_file:
        description: "Path to the file containing URLs to scan with Nuclei"
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  nuclei-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      # GitHub Checkout
      # https://github.com/marketplace/actions/checkout

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Nuclei
      # https://github.com/projectdiscovery/nuclei-action

      - name: Install Nuclei
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538  # v3.1.1
        with:
          install-only: true

      - name: Nuclei run
        id: nuclei_scan
        shell: bash
        env:
          URLS_FILE: ${{ inputs.urls_file }}
        run: |
          set -o pipefail
          nuclei -list "$URLS_FILE" -severity low,medium,high,critical \
            -H 'User-Agent: osinfra.io - Vulnerability Scan' \
            -jsonl-export nuclei.jsonl -sarif-export nuclei.sarif \
            2>&1 | tee "$RUNNER_TEMP/nuclei-output.txt"

      # GitHub Upload Artifact
      # https://github.com/actions/upload-artifact

      - name: GitHub workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: success() && hashFiles('nuclei.sarif') != ''
        with:
          name: nuclei-artifacts
          path: |
            nuclei.jsonl
            nuclei.sarif

      # GitHub CodeQL upload SARIF
      # https://github.com/github/codeql-action

      - name: GitHub security dashboard alerts update
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        if: success() && hashFiles('nuclei.sarif') != ''
        with:
          sarif_file: nuclei.sarif
          category: ${{ github.workflow }}

      - name: Nuclei summary
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          SCAN_OUTCOME: ${{ steps.nuclei_scan.outcome }}
          URLS_FILE: ${{ inputs.urls_file }}
        with:
          script: |
            const fs = require('fs');
            const esc = (value) => String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const targets = fs.existsSync(process.env.URLS_FILE)
              ? fs.readFileSync(process.env.URLS_FILE, 'utf8').split(/\r?\n/).map((line) => line.trim()).filter((line) => line && !line.startsWith('#'))
              : [];
            const findings = [];
            let reportError;
            const counts = { critical: 0, high: 0, medium: 0, low: 0 };
            try {
              const records = fs.existsSync('nuclei.jsonl')
                ? fs.readFileSync('nuclei.jsonl', 'utf8').split(/\r?\n/).filter((line) => line.trim())
                : [];
              for (const record of records) {
                const finding = JSON.parse(record);
                const severity = finding?.info?.severity;
                const target = finding?.['matched-at'] || finding?.host;
                if (!Object.hasOwn(counts, severity) || typeof finding?.['template-id'] !== 'string' || typeof target !== 'string') {
                  throw new Error('Invalid Nuclei finding: expected severity, template ID, and target');
                }
                findings.push(finding);
                counts[severity]++;
              }
            } catch (error) {
              reportError = `Could not read the complete Nuclei report: ${error.message}`;
              core.warning(reportError);
            }
            const logo = '<picture><source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/projectdiscovery/docs/main/logo/ProjectDiscovery-Mark-OnDark.svg"><img src="https://raw.githubusercontent.com/projectdiscovery/docs/main/logo/ProjectDiscovery-Mark-OnLight.svg" alt="ProjectDiscovery" height="24"></picture>';
            const lines = [logo, '', '## Nuclei vulnerability scan', ''];
            const outcome = process.env.SCAN_OUTCOME;
            if (outcome === 'success' && !reportError) {
              lines.push(findings.length ? `**Scan complete: ${findings.length} findings reported.**` : '**Scan complete: no findings reported.**', '');
            } else {
              lines.push(`**Scan ${esc(outcome || 'not run')}. Results may be incomplete; see the job logs.**`, '');
            }
            if (reportError) {
              lines.push(`<pre>${esc(reportError)}</pre>`, '', 'Counts below include only successfully parsed findings.', '');
            }
            lines.push('| Critical | High | Medium | Low |', '|---|---|---|---|',
              `| ${counts.critical} | ${counts.high} | ${counts.medium} | ${counts.low} |`, '');
            lines.push(`<details><summary>Targets (${targets.length})</summary>`, '', `<pre>${esc(targets.join('\n'))}</pre>`, '', '</details>', '');
            if (findings.length) {
              lines.push('<details><summary>Findings</summary>', '', '<table>',
                '<tr><th>Severity</th><th>Template</th><th>Target</th></tr>');
              for (const finding of findings.slice(0, 100)) {
                lines.push(`<tr><td>${esc(finding.info.severity)}</td><td>${esc(finding['template-id'])}</td><td>${esc(finding['matched-at'] || finding.host)}</td></tr>`);
              }
              lines.push('</table>', '', '</details>', '');
              if (findings.length > 100) {
                lines.push('Showing the first 100 findings. See the SARIF artifact for the full results.', '');
              }
            }
            const outputFile = `${process.env.RUNNER_TEMP}/nuclei-output.txt`;
            const output = fs.existsSync(outputFile)
              ? fs.readFileSync(outputFile, 'utf8').replace(/\x1b\[[0-9;]*m/g, '')
              : '';
            if (output) {
              lines.push('<details><summary>Scan output</summary>', '', `<pre>${esc(output.slice(0, 50000))}</pre>`, '', '</details>', '');
              if (output.length > 50000) {
                lines.push('Output truncated; see the job logs for the full output.', '');
              }
            }
            await core.summary.addRaw(lines.join('\n')).write();
